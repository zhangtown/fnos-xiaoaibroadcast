<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>小爱播报</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23FF6B3D'/%3E%3Cpath d='M12 13h3l5-4v14l-5-4h-3z' fill='%23fff'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#f6f4f1; --card:#ffffff; --ink:#1d1c1a; --muted:#726d66; --line:#e8e3db;
    --accent:#ff6b3d; --accent-ink:#fff; --accent-soft:#fff2ec;
    --ok:#2f9e6b; --bad:#d9503f; --shadow:0 1px 2px rgba(29,28,26,.05),0 8px 24px -12px rgba(29,28,26,.18);
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141312; --card:#1e1d1b; --ink:#f2efe9; --muted:#a8a29a; --line:#2f2d2a;
           --accent:#ff7a4d; --accent-soft:#2a1c15; --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 30px -16px rgba(0,0,0,.8); }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink); -webkit-font-smoothing:antialiased;
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    padding:0 16px calc(48px + env(safe-area-inset-bottom));
  }
  .wrap{max-width:840px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;padding:22px 2px 14px}
  .logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(150deg,#ff8a4d,#ff5f2e);
    display:grid;place-items:center;box-shadow:0 6px 16px -8px rgba(255,95,46,.9);flex:0 0 auto}
  .logo svg{width:19px;height:19px;fill:#fff}
  h1{font-size:19px;margin:0;letter-spacing:.2px;font-weight:650}
  .sub{color:var(--muted);font-size:12.5px;margin-top:-2px}
  .badge{margin-left:auto;font-size:12.5px;padding:5px 11px;border-radius:999px;background:var(--card);
    border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .badge.on{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,var(--line))}
  .badge.off{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px;margin:14px 0}
  .card h2{font-size:14px;margin:0 0 14px;font-weight:650;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
  .card h2 .hint{font-weight:400;color:var(--muted);font-size:12.5px;letter-spacing:0}
  .next{display:flex;flex-wrap:wrap;gap:10px}
  .next .item{flex:1 1 210px;background:var(--accent-soft);border-radius:12px;padding:11px 13px;
    border:1px solid color-mix(in srgb,var(--accent) 16%,transparent)}
  .next .t{font-variant-numeric:tabular-nums;font-weight:650;font-size:15px;color:var(--accent)}
  .next .x{font-size:12.5px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
  .next .hero .x{color:var(--ink);font-size:13.5px}
  .empty{color:var(--muted);font-size:13px;padding:6px 0}
  .srow{display:grid;grid-template-columns:112px 1fr 44px;gap:12px;align-items:start;padding:14px 0;border-top:1px dashed var(--line)}
  .srow:first-of-type{border-top:0;padding-top:0}
  /* 输入框和下拉框统一高度：select 用浏览器原生控件时比 input 矮一截，靠固定高度对齐 */
  input[type=time],input[type=text],input[type=password],input[type=number],select,textarea{
    font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;
    padding:8px 10px;width:100%;outline:none;transition:border-color .15s, box-shadow .15s}
  input[type=time],input[type=text],input[type=password],input[type=number],select{
    height:38px;padding-top:0;padding-bottom:0}
  select{padding-right:8px}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 16%,transparent)}
  input[type=time]{font-variant-numeric:tabular-nums;font-weight:600;padding:0 6px;min-width:0;height:38px}
  input[type=range]{width:100%;accent-color:var(--accent);background:transparent;border:0;padding:0;height:30px}
  textarea{resize:vertical;min-height:56px;line-height:1.55}
  .days{display:flex;align-items:center;gap:5px;margin-top:7px;flex-wrap:wrap}
  .del{color:var(--bad);cursor:pointer;font-size:12.5px;white-space:nowrap;margin-left:auto;padding-left:8px}
  .day{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:transparent;
    color:var(--muted);cursor:pointer;user-select:none;line-height:1.35}
  .day.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .switch{position:relative;width:40px;height:23px;flex:0 0 auto;cursor:pointer}
  .switch input{position:absolute;opacity:0;width:0;height:0}
  .switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .18s}
  .switch span:after{content:"";position:absolute;width:17px;height:17px;left:3px;top:3px;background:#fff;
    border-radius:50%;transition:transform .18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .switch input:checked + span{background:var(--accent)}
  .switch input:checked + span:after{transform:translateX(17px)}
  .btn{font:inherit;font-weight:560;border-radius:10px;border:1px solid var(--line);background:var(--card);
    color:var(--ink);height:38px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;
    cursor:pointer;transition:transform .06s,background .15s,border-color .15s;white-space:nowrap}
  .btn:hover{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
  .btn:active{transform:translateY(1px)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .btn.primary:hover{filter:brightness(1.04)}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.55;cursor:default}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .row > .grow{flex:1 1 200px;min-width:0}
  label.lbl{display:block;font-size:12.5px;color:var(--muted);margin:0 0 5px}
  .logs{max-height:270px;overflow:auto;margin:0 -4px}
  .log{display:flex;gap:9px;padding:7px 4px;border-bottom:1px dashed var(--line);font-size:13px;align-items:baseline}
  .log:last-child{border-bottom:0}
  .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto;margin-top:6px}
  .dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)}
  .log time{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px;flex:0 0 auto}
  .log .m{color:var(--muted);font-size:12.5px}
  .log .txt{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);background:#1d1c1a;color:#fff;
    padding:10px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.2s;z-index:9;max-width:90vw;text-align:center}
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .toast.bad{background:var(--bad)}
  .tip{font-size:12.5px;color:var(--muted);margin-top:10px;line-height:1.65}
  .tip b{color:var(--ink);font-weight:600}
  code{background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;font-size:12px}
  .sep{height:1px;background:var(--line);margin:16px 0}
  .storytext{white-space:pre-wrap;line-height:1.75;font-size:14px;max-height:320px;overflow:auto;
    background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
  .volrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .volrow .lbl{margin:0;white-space:nowrap}
  .volrow input[type=range]{max-width:300px}
  .volrow .h{white-space:nowrap}
  @media (max-width:560px){
    .srow{grid-template-columns:98px 1fr 40px;gap:10px}
    header{padding-top:16px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><svg viewBox="0 0 24 24"><path d="M4 9h3l5-4v14l-5-4H4zM16.5 8.2a5 5 0 0 1 0 7.6l-.9-1.2a3.4 3.4 0 0 0 0-5.2z"/></svg></div>
    <div>
      <h1>小爱播报</h1>
      <div class="sub">到点让小爱说句话、放首歌，或讲个故事</div>
    </div>
    <div id="badge" class="badge">读取中…</div>
  </header>

  <section class="card">
    <h2>音乐 <span class="hint">选文件夹 → 选歌 → 播放</span></h2>
    <div class="row">
      <div class="grow">
        <label class="lbl">音频文件夹</label>
        <select id="folderPick"><option value="">（加载中…）</option></select>
      </div>
      <div class="grow">
        <label class="lbl">曲库</label>
        <select id="musicPick"><option value="">（先选文件夹）</option></select>
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn primary" id="playBtn">播放</button>
      <button class="btn" id="stopBtn">停止</button>
      <button class="btn ghost" id="musicReload">刷新</button>
    </div>
    <div class="tip" id="musicHint"></div>
  </section>
  <datalist id="modelList"></datalist>

  <section class="card">
    <h2>音箱 <span class="hint" id="devHint"></span></h2>
    <div class="row">
      <div class="grow"><label class="lbl">播报的音箱</label><select id="deviceSel"><option value="">（还没拉设备）</option></select></div>
      <button class="btn" id="reloadDev">刷新设备</button>
    </div>
    <div class="sep"></div>
    <div class="volrow">
      <label class="lbl">音箱音量 <b id="volVal">–</b></label>
      <input type="range" id="volume" min="0" max="100" step="1" value="0" />
      <span class="h" style="font-size:12px;color:var(--muted)">拖动即时生效</span>
    </div>
    <div class="sep"></div>
    <div class="row">
      <div class="grow">
        <label class="lbl">试一句话（会立刻出声）</label>
        <input type="text" id="testText" value="测试一下，我是小爱播报。" />
      </div>
      <button class="btn" id="testBtn">说话</button>
    </div>
  </section>

  <section class="card">
    <h2>播报表 <span class="hint">只做定时播报</span></h2>
    <div id="schedules"></div>
    <div class="row" style="margin-top:14px">
      <button class="btn ghost" id="addBtn">＋ 加一条</button>
      <button class="btn primary" id="saveBtn" disabled>保存播报表</button>
    </div>
  </section>

  <section class="card">
    <h2>故事 <span class="hint">选经典故事，或让大模型现编；看好了再让小爱讲</span></h2>
    <div class="row">
      <div class="grow">
        <label class="lbl">经典故事（读本地故事集，不再生成）</label>
        <select id="classicPick"><option value="">（加载中…）</option></select>
      </div>
      <button class="btn" id="classicReload">刷新</button>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="grow">
        <label class="lbl">或者让大模型现编（提示词可留空）</label>
        <input type="text" id="storyPrompt" placeholder="比如：讲一个小熊不肯刷牙的故事" />
      </div>
      <button class="btn primary" id="storyGenBtn">生成故事</button>
    </div>
    <div id="storyBox" style="display:none">
      <div class="sep"></div>
      <div class="storytext" id="storyText"></div>
      <div class="row" style="margin-top:10px;align-items:center">
        <button class="btn" id="storyRegen">重新生成</button>
        <button class="btn primary" id="storySpeakBtn">让小爱讲</button>
        <span class="h" id="storyMeta" style="font-size:12.5px;color:var(--muted)"></span>
      </div>
    </div>
    <div class="tip" id="storyHint"></div>
  </section>

  <section class="card">
    <h2>接下来 <span class="hint" id="nowHint"></span></h2>
    <div class="next" id="next"><div class="empty">还没有启用的播报</div></div>
  </section>

  <section class="card">
    <h2>设置</h2>

    <div class="tip" style="margin:0 0 10px"><b>大模型</b>（讲故事用，OpenAI 兼容接口）</div>
    <div class="row">
      <div class="grow"><label class="lbl">接口地址</label><input type="text" id="llmBase" placeholder="https://api.deepseek.com/v1" /></div>
      <div class="grow" style="flex:0 1 210px">
        <label class="lbl">模型</label>
        <select id="llmModelSel"></select>
      </div>
      <div class="grow" style="flex:0 1 210px" id="llmModelCustomWrap" hidden>
        <label class="lbl">自定义模型名</label>
        <input type="text" id="llmModel" placeholder="填接口支持的模型名" />
      </div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="grow"><label class="lbl">API Key</label><input type="password" id="llmKey" placeholder="留空表示不修改" autocomplete="off" /></div>
      <button class="btn" id="llmTest">测试连接</button>
      <button class="btn primary" id="llmSave">保存</button>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="grow" style="flex:0 1 150px"><label class="lbl">输出上限（tokens）</label><input type="number" id="llmMaxTokens" min="0" max="8000" step="100" /></div>
      <div class="grow" style="flex:0 1 190px">
        <label class="lbl">思考强度</label>
        <select id="llmEffort">
          <option value="">不发送（推荐）</option>
          <option value="none">none（部分厂商支持）</option>
          <option value="low">low</option>
          <option value="medium">medium</option>
          <option value="high">high</option>
        </select>
      </div>
      <span class="h" style="font-size:12px;color:var(--muted);padding-bottom:9px">推理模型才需要动这里</span>
    </div>
    <div class="tip" id="llmHint"></div>

    <div class="sep"></div>
    <div class="tip" style="margin:0 0 10px"><b>故事语音</b>（只影响「让小爱讲」，播报仍走小爱自带）</div>
    <div class="row">
      <div class="grow" style="flex:0 1 280px">
        <label class="lbl">引擎</label>
        <select id="speechEngine">
          <option value="">小爱自带（稳）</option>
          <option value="qwen">阿里云百炼 Qwen-Audio-TTS（推荐）</option>
          <option value="tencent">腾讯云语音合成</option>
          <option value="openai">OpenAI 兼容语音</option>
        </select>
      </div>
      <div class="grow" id="speechBaseWrap">
        <label class="lbl">接口地址（留空=默认）</label>
        <input type="text" id="speechBase" placeholder="wss://dashscope.aliyuncs.com/api-ws/v1/inference" />
      </div>
      <div class="grow" id="speechKeyWrap">
        <label class="lbl">API Key（留空=不修改）</label>
        <input type="password" id="speechKey" placeholder="sk-..." autocomplete="off" />
      </div>
    </div>
    <div class="row" style="margin-top:10px;align-items:flex-end">
      <div class="grow" style="flex:0 1 250px">
        <label class="lbl">模型</label>
        <select id="speechModel"></select>
      </div>
      <div class="grow" style="flex:1 1 300px">
        <label class="lbl">音色</label>
        <select id="speechVoice"></select>
      </div>
      <div style="display:flex;gap:10px;padding-bottom:1px">
        <button class="btn" id="speechTest">试听</button>
        <button class="btn primary" id="speechSave">保存</button>
      </div>
    </div>
    <div class="row" id="speechCustomRow" style="margin-top:10px;display:none">
      <div class="grow"><label class="lbl">自定义模型名</label><input type="text" id="speechModelCustom" placeholder="模型 id" /></div>
      <div class="grow"><label class="lbl">自定义音色 id</label><input type="text" id="speechVoiceCustom" placeholder="音色 id" /></div>
    </div>
    <div class="row" id="speechExtRow" style="margin-top:10px">
      <div class="grow"><label class="lbl">TTS 外链前缀（留空=用本应用音源口）</label><input type="text" id="speechExtBase" placeholder="http://192.168.31.68:8090/music/xiaoai-tts" /></div>
      <div class="grow"><label class="lbl">TTS 落盘目录</label><input type="text" id="speechExtDir" placeholder="/vol3/1000/music/xiaoai-tts" /></div>
    </div>
    <div class="row" id="speechTencentRow" style="margin-top:10px;display:none">
      <div class="grow"><label class="lbl">SecretId</label><input type="text" id="speechSid" placeholder="AKID..." autocomplete="off" /></div>
      <div class="grow"><label class="lbl">SecretKey</label><input type="password" id="speechSkey" placeholder="留空表示不修改" autocomplete="off" /></div>
      <div class="grow" style="flex:0 1 150px"><label class="lbl">地域</label><input type="text" id="speechRegion" placeholder="ap-shanghai" /></div>
    </div>
    <div class="tip" id="speechHint">音色跟模型绑定，换模型会自动换列表；合成失败会自动退回小爱朗读。</div>


    <div class="sep"></div>
    <div class="tip" style="margin:0 0 10px"><b>曲库与音源</b>（音箱从这里取歌）</div>
    <div class="row">
      <div class="grow"><label class="lbl">音乐目录（一行一个）</label><textarea id="musicDirs" rows="2"></textarea></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div class="grow" style="flex:0 1 150px"><label class="lbl">音源端口</label><input type="number" id="musicPort" min="0" max="65535" /></div>
      <div class="grow"><label class="lbl">对外地址（可留空，自动探测）</label><input type="text" id="musicBase" placeholder="http://192.168.1.10:18090" /></div>
      <button class="btn primary" id="musicSave">保存</button>
    </div>
    <div class="tip" id="musicCfgHint"></div>

    <div class="sep"></div>
    <div class="tip" style="margin:0 0 10px"><b>票据</b>（小米登录态，从 NAS 上的 xiaomusic 同步）</div>
    <div class="row">
      <button class="btn" id="syncBtn">重新同步票据</button>
      <span class="h" id="ticketState" style="font-size:12.5px;color:var(--muted)"></span>
    </div>

    <div class="sep"></div>
    <div class="tip" id="about"></div>
  </section>

  <section class="card">
    <h2>执行记录 <span class="hint">最近 60 条，重启不丢</span></h2>
    <div class="logs" id="logs"></div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
const BASE = location.pathname.replace(/\/index\.html$/, "").replace(/\/+$/, "");
const $ = (id) => document.getElementById(id);
const DAYS = ["一","二","三","四","五","六","日"];
let state = {schedules: [], devices: [], music: {items: [], folders: []}};
let dirty = false;
let speechDirty = false; // 语音设置这块被改过之后，定时刷新不要再回填覆盖
const formDirty = { llm: false, music: false };
let volBusy = false, volTimer = null;
let storyText = "";

async function api(path, body) {
  const opt = body === undefined ? {} : {
    method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)
  };
  const res = await fetch(BASE + path, opt);
  let data = null;
  try { data = await res.json(); } catch (e) { throw new Error("服务返回了非 JSON（HTTP " + res.status + "）"); }
  return data;
}

function toast(msg, bad) {
  const t = $("toast");
  t.textContent = msg;
  t.className = "toast show" + (bad ? " bad" : "");
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.className = "toast"; }, bad ? 4200 : 1900);
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
}

async function loadState() {
  const s = await api("/api/state");
  state = {...state, ...s};
  render();
}

function render() {
  const badge = $("badge");
  if (!state.ready) { badge.className = "badge off"; badge.textContent = "还没同步票据"; }
  else if (!state.device || !state.device.did) { badge.className = "badge off"; badge.textContent = "还没选音箱"; }
  else { badge.className = "badge on"; badge.textContent = "就绪"; }

  $("nowHint").textContent = state.now ? "现在 " + state.now : "";
  renderNext();
  renderSchedules();
  renderDevice();
  renderSettings();
  renderStory();

  const logs = state.logs || [];
  $("logs").innerHTML = logs.length ? logs.map((l) => `
    <div class="log">
      <span class="dot ${l.ok ? "ok" : "bad"}"></span>
      <time>${new Date(l.at * 1000).toLocaleString("zh-CN", {hour12: false, month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit"})}</time>
      <span class="txt">${l.text ? esc(l.text) : "（系统）"}</span>

function renderSchedules() {
  const box = $("schedules");
  const list = state.schedules || [];
  if (!list.length) { box.innerHTML = `<div class="empty">还没有播报，点下面「加一条」</div>`; return; }
  box.innerHTML = list.map((s, i) => `
    <div class="srow" data-i="${i}">
      <div><input type="time" value="${esc(s.time)}" data-k="time" /></div>
      <div>

        <textarea data-k="text" rows="2" placeholder="要小爱说的那句话">${esc(s.text)}</textarea>
        <div class="days">${DAYS.map((d, j) => `<span class="day ${(s.days || []).includes(j + 1) ? "sel" : ""}" data-d="${j + 1}">周${d}</span>`).join("")}<span class="del" data-del="${i}">删除</span></div>
      </div>
      <label class="switch" title="启用"><input type="checkbox" data-k="enabled" ${s.enabled ? "checked" : ""}/><span></span></label>
    </div>`).join("");

  box.querySelectorAll("[data-k]").forEach((el) => {
    el.addEventListener("input", () => {
      const i = +el.closest(".srow").dataset.i;
      const k = el.dataset.k;
      state.schedules[i][k] = el.type === "checkbox" ? el.checked : el.value;
      markDirty();
    });
  });
  box.querySelectorAll("[data-del]").forEach((el) => {
    el.addEventListener("click", () => {
      const i = +el.dataset.del;
      if (!confirm("删掉这条播报？")) return;
      state.schedules.splice(i, 1);
      renderSchedules();
      markDirty();
      toast("已删除，记得点「保存播报表」");
    });
  });
  box.querySelectorAll(".day").forEach((el) => {
    el.addEventListener("click", () => {
      const i = +el.closest(".srow").dataset.i;
      const d = +el.dataset.d;
      const days = new Set(state.schedules[i].days || []);
      days.has(d) ? days.delete(d) : days.add(d);
      state.schedules[i].days = [...days].sort((a, b) => a - b);
      el.classList.toggle("sel");
      markDirty();
    });
  });
}

// 引擎 → 可选模型 / 音色
function speechModelsFor(engine) {
  if (engine === "qwen") return state.qwenModels || [];
  if (engine === "openai") return ["tts-1", "FunAudioLLM/CosyVoice2-0.5B"];
  return [];
}
function speechVoicesFor(engine, model) {
  if (engine === "qwen") {
    // 音色跟模型绑定：换了模型就换一份列表
    const byModel = state.qwenVoicesByModel || {};
    return byModel[model] || state.qwenVoices || [];
  }
  if (engine === "openai") return state.openaiVoices || [];
  if (engine === "tencent") return state.tencentVoices || [];
  return [];
}

// 把模型/音色两个下拉填好；当前值不在候选里就加一条“自定义”
function fillSpeechOptions(voice, model) {
  const engine = $("speechEngine").value;
  const showAudio = engine === "qwen" || engine === "openai";

  $("speechBaseWrap").style.display = showAudio ? "" : "none";
  $("speechKeyWrap").style.display = showAudio ? "" : "none";
  $("speechTencentRow").style.display = engine === "tencent" ? "flex" : "none";

  const models = speechModelsFor(engine);
  const curModel = model !== undefined ? model : $("speechModel").value;
  $("speechModel").innerHTML = models.map((m) => `<option value="${esc(m)}">${esc(m)}</option>`).join("")
    + `<option value="__custom__">自定义…</option>`;
  if (models.includes(curModel)) {
    $("speechModel").value = curModel;
    $("speechModelCustom").value = "";
  } else {
    $("speechModel").value = "__custom__";
    $("speechModelCustom").value = curModel || "";
  }

  const voices = speechVoicesFor(engine, $("speechModel").value);
  const curVoice = voice !== undefined ? voice : $("speechVoice").value;
  $("speechVoice").innerHTML = voices.map((v) => `<option value="${esc(v.id)}">${esc(v.label)}</option>`).join("")
    + `<option value="__custom__">自定义…</option>`;
  if (!voices.length) {
    $("speechVoice").innerHTML = `<option value="">（该引擎不需要选音色）</option>`;
    $("speechVoice").value = "";
  } else if (voices.some((v) => v.id === curVoice)) {
    $("speechVoice").value = curVoice;
    $("speechVoiceCustom").value = "";
  } else {
    $("speechVoice").value = "__custom__";
    $("speechVoiceCustom").value = curVoice || "";
  }
  syncSpeechCustomRow();
}

function syncSpeechCustomRow() {
  const need = $("speechModel").value === "__custom__" && speechModelsFor($("speechEngine").value).length > 0
    || $("speechVoice").value === "__custom__";
  $("speechCustomRow").style.display = need ? "flex" : "none";
}

// 选中引擎后带入它的默认地址/模型/音色；API Key 一律留空让人自己填
const SPEECH_PRESETS = {
  openai: { base: "https://api.siliconflow.cn/v1", model: "FunAudioLLM/CosyVoice2-0.5B", voice: "FunAudioLLM/CosyVoice2-0.5B:claire" },
  qwen: { base: "wss://dashscope.aliyuncs.com/api-ws/v1/inference", model: "qwen-audio-3.1-tts-flash", voice: "wenhuaiqing_v3.1" },
  tencent: { base: "", model: "", voice: "101001" },
  "": { base: "", model: "", voice: "" },
};

$("speechEngine").onchange = () => {
  const engine = $("speechEngine").value;
  const preset = SPEECH_PRESETS[engine] || { base: "", model: "", voice: "" };
  $("speechBase").value = preset.base;
  $("speechKey").value = "";
  fillSpeechOptions(preset.voice, preset.model);
};

$("speechModel").onchange = () => {
  // 换模型就要换音色列表；当前音色不在新模型里就退回第一个
  const newModel = $("speechModel").value === "__custom__" ? $("speechModelCustom").value.trim() : $("speechModel").value;
  const pool = speechVoicesFor($("speechEngine").value, newModel);
  const cur = currentSpeechVoice();
  const compatible = pool.some((v) => v.id === cur);
  const pick = compatible ? cur : (pool[0] ? pool[0].id : "");
  fillSpeechOptions(pick, newModel);
  if (!compatible && pool.length) {
    toast("音色不属于这个模型，已换成 " + pool[0].id);
  }
  speechDirty = true;
  speechStatus();
};
$("speechVoice").onchange = () => { syncSpeechCustomRow(); speechDirty = true; speechStatus(); };

function currentSpeechModel() {
  return $("speechModel").value === "__custom__" ? $("speechModelCustom").value.trim() : $("speechModel").value;
}
function currentSpeechVoice() {
  return $("speechVoice").value === "__custom__" ? $("speechVoiceCustom").value.trim() : $("speechVoice").value;
}

function speechStatus() {
  const sp = state.speech || {};
  const engine = $("speechEngine").value || sp.engine || "";
  const parts = [];
  if (sp.engine) parts.push("当前已保存：" + ({ "": "小爱自带", openai: "OpenAI 兼容", qwen: "百炼 Qwen", tencent: "腾讯云" }[sp.engine] || sp.engine));
  if (sp.hasKey) parts.push("Key " + (sp.keyMask || "已保存"));
  if (sp.hasSecret) parts.push("SecretId 已保存");
  if (sp.voice) parts.push("音色 " + sp.voice);

  const u = (state.usage || {}).total;
  if (u && u.calls) parts.push(`本地已合成 ${u.calls} 次 / ${u.chars} 字`);
  if (parts.length) $("speechHint").innerHTML = esc(parts.join(" · "));
}

}

    $("storyBox").style.display = "block";
    $("storyText").textContent = storyText;
    $("storyMeta").textContent = category + " · " + r.chars + " 字";
    toast("已选《" + name + "》，点「让小爱讲」");
  } catch (e) { toast(e.message, true); }
};

$("classicReload").onclick = async () => { await loadClassics(); toast("故事集已刷新"); };

$("llmModelSel").onchange = () => {
  $("llmModelCustomWrap").hidden = $("llmModelSel").value !== "__custom__";
};
// ---------- 故事：先生成，再讲 ----------
async function genStory() {
  const btn = $("storyGenBtn"), regen = $("storyRegen");
  const label = btn.textContent;
  btn.disabled = true; regen.disabled = true; btn.textContent = "生成中…";
  try {
    const r = await api("/api/story/generate", {prompt: $("storyPrompt").value});
    if (r.ok) {
      storyText = r.story || "";
      $("storyBox").style.display = "block";
      $("storyText").textContent = storyText;
      $("storyMeta").textContent = [r.model, (r.chars || 0) + " 字", r.tookMs ? (r.tookMs / 1000).toFixed(1) + "s" : ""].filter(Boolean).join(" · ");
      toast("生成好了，看看稿子满意不满意");
    } else {
      toast(r.error || "生成失败", true);
      $("storyHint").innerHTML = "生成失败：" + esc(r.error || "");
    }
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; regen.disabled = false; btn.textContent = label; }
}

$("storyGenBtn").onclick = genStory;
$("storyRegen").onclick = genStory;

$("storySpeakBtn").onclick = async () => {
  if (!storyText) { toast("先生成故事", true); return; }
  const btn = $("storySpeakBtn");
  btn.disabled = true; btn.textContent = "发送中…";
  try {
    const r = await api("/api/story/speak", {text: storyText});
    toast(r.ok ? "正在念，听一下音箱" : (r.error || "失败"), !r.ok);
    await loadState();
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = "让小爱讲"; }
};

// ---------- 其他 ----------
async function reloadDevices() {
  const r = await api("/api/devices");
  state.devices = r.devices || [];
  renderDevice();
  toast(r.ok ? ("拉到 " + state.devices.length + " 台设备") : (r.error || "拉取失败"), !r.ok);
}

$("deviceSel").onchange = async (e) => {
  const d = (state.devices || []).find((x) => x.did === e.target.value);
  if (!d) return;
  const r = await api("/api/device", {did: d.did, name: d.name, model: d.model || ""});
  if (r.ok) { toast("已选 " + d.name); await loadState(); await loadVolume(); } else { toast(r.error || "保存失败", true); }
};
$("reloadDev").onclick = async () => { await reloadDevices(); await loadVolume(); };

$("addBtn").onclick = () => {
  state.schedules = state.schedules || [];
  state.schedules.push({id: "", time: "07:00", days: [1,2,3,4,5], kind: "say", text: "早上好，出门前记得：带汗巾、吃维生素、抹油油。", enabled: true});
  renderSchedules(); markDirty();
};

$("saveBtn").onclick = async () => {
  const payload = (state.schedules || []).map((s) => ({
    id: s.id || "", time: s.time, days: s.days || [], kind: "say", text: s.text || "", enabled: !!s.enabled
  }));
  for (const s of payload) {
    if (!s.text.trim()) { toast("有一条文案是空的", true); return; }
  }
  const r = await api("/api/schedules", {schedules: payload});
  if (!r.ok) { toast(r.error || "保存失败", true); return; }
  dirty = false; $("saveBtn").disabled = true;
  toast("已保存");
  await loadState();
};

$("playBtn").onclick = async () => {
  const url = $("musicPick").value;
  if (!url) { toast("先在曲库里选一首", true); return; }
  const btn = $("playBtn");
  btn.disabled = true; btn.textContent = "播放中…";
  try {
    const r = await api("/api/play", {url});
    toast(r.ok ? "正在播放" : (r.error || "播放失败"), !r.ok);
    await loadState();
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = "播放"; }
};

$("stopBtn").onclick = async () => {
  const r = await api("/api/stop", {});
  toast(r.ok ? "已停止" : (r.error || "停止失败"), !r.ok);
};

$("testBtn").onclick = async () => {
  const btn = $("testBtn");
  btn.disabled = true; btn.textContent = "发送中…";
  try {
    const r = await api("/api/test", {text: $("testText").value});
    toast(r.ok ? "已发出去，听一下音箱" : (r.error || "失败"), !r.ok);
    await loadState();
  } catch (e) { toast(e.message, true); }
  finally { btn.disabled = false; btn.textContent = "说话"; }
};

loadState()
  .then(() => Promise.all([loadFolders(), loadVolume(), loadClassics()]))
  .then(loadSongs)
  .catch((e) => { $("badge").textContent = "连不上应用"; toast(e.message, true); });
setInterval(() => { if (!dirty) loadState().catch(() => {}); }, 30000);
</script>
</body>
</html>
